<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Hooks Demo - useState & useEffect</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        /* Clock Styles */
        .clock-display {
            font-size: 3rem;
            font-weight: bold;
            color: #764ba2;
            text-align: center;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .date-display {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .clock-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .form-output {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .form-output h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-output p {
            margin: 8px 0;
            color: #333;
        }

        .form-output strong {
            color: #764ba2;
        }

        /* Counter Styles */
        .counter-display {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 30px 0;
        }

        .counter-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lifecycle-log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .lifecycle-log h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .log-entry {
            padding: 5px;
            margin: 3px 0;
            background: white;
            border-left: 3px solid #667eea;
            padding-left: 10px;
            font-size: 0.9rem;
            color: #333;
        }

        .explanation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }

        .explanation h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .explanation p {
            color: #856404;
            line-height: 1.6;
        }

        .code-snippet {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 1. LIVE CLOCK COMPONENT - Demonstrates useEffect with cleanup
        function LiveClock() {
            const [time, setTime] = useState(new Date());
            const [isRunning, setIsRunning] = useState(true);
            const [logs, setLogs] = useState([]);

            const addLog = (message) => {
                setLogs(prev => [...prev, `${new Date().toLocaleTimeString()}: ${message}`]);
            };

            // Effect for clock timer - demonstrates cleanup
            useEffect(() => {
                addLog('⏰ Clock effect mounted - timer started');

                if (isRunning) {
                    const intervalId = setInterval(() => {
                        setTime(new Date());
                    }, 1000);

                    // CLEANUP FUNCTION - runs before effect re-runs and on unmount
                    return () => {
                        addLog('🧹 Cleanup: Clearing interval');
                        clearInterval(intervalId);
                    };
                }
            }, [isRunning]); // Re-run when isRunning changes

            // Effect to log time changes
            useEffect(() => {
                addLog(`🕐 Time updated: ${time.toLocaleTimeString()}`);
            }, [time]);

            const formatTime = (date) => {
                return date.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            };

            const formatDate = (date) => {
                return date.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            };

            return (
                <div className="card">
                    <h2>🕐 Live Clock</h2>
                    <div className="date-display">{formatDate(time)}</div>
                    <div className="clock-display">{formatTime(time)}</div>
                    
                    <div className="clock-controls">
                        <button onClick={() => setIsRunning(!isRunning)}>
                            {isRunning ? '⏸️ Pause' : '▶️ Resume'}
                        </button>
                        <button onClick={() => setTime(new Date())}>
                            🔄 Reset
                        </button>
                    </div>

                    <div className="lifecycle-log">
                        <h3>📋 Lifecycle Logs (Last 5)</h3>
                        {logs.slice(-5).map((log, index) => (
                            <div key={index} className="log-entry">{log}</div>
                        ))}
                    </div>

                    <div className="explanation">
                        <h4>💡 What's Happening?</h4>
                        <p>
                            <strong>useEffect cleanup:</strong> When the clock is paused or component unmounts, 
                            the cleanup function clears the interval to prevent memory leaks. This is equivalent 
                            to componentWillUnmount in class components.
                        </p>
                    </div>
                </div>
            );
        }

        // 2. CONTROLLED FORM COMPONENT - Demonstrates useState with forms
        function ControlledForm() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                age: '',
                country: '',
                bio: '',
                subscribe: false
            });
            const [submitted, setSubmitted] = useState(false);
            const [errors, setErrors] = useState({});

            // Handle input changes
            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
                // Clear error for this field when user starts typing
                if (errors[name]) {
                    setErrors(prev => ({ ...prev, [name]: '' }));
                }
            };

            // Validate form
            const validate = () => {
                const newErrors = {};
                if (!formData.name.trim()) newErrors.name = 'Name is required';
                if (!formData.email.trim()) {
                    newErrors.email = 'Email is required';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'Email is invalid';
                }
                if (!formData.age) {
                    newErrors.age = 'Age is required';
                } else if (formData.age < 1 || formData.age > 120) {
                    newErrors.age = 'Age must be between 1 and 120';
                }
                if (!formData.country) newErrors.country = 'Please select a country';
                return newErrors;
            };

            // Handle form submission
            const handleSubmit = (e) => {
                e.preventDefault();
                const newErrors = validate();
                
                if (Object.keys(newErrors).length === 0) {
                    setSubmitted(true);
                    setErrors({});
                } else {
                    setErrors(newErrors);
                    setSubmitted(false);
                }
            };

            // Reset form
            const handleReset = () => {
                setFormData({
                    name: '',
                    email: '',
                    age: '',
                    country: '',
                    bio: '',
                    subscribe: false
                });
                setSubmitted(false);
                setErrors({});
            };

            return (
                <div className="card">
                    <h2>📝 Controlled Form</h2>
                    
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label htmlFor="name">Name *</label>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                value={formData.name}
                                onChange={handleChange}
                                placeholder="Enter your name"
                            />
                            {errors.name && <p style={{color: 'red', fontSize: '0.9rem', marginTop: '5px'}}>{errors.name}</p>}
                        </div>

                        <div className="form-group">
                            <label htmlFor="email">Email *</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                placeholder="your.email@example.com"
                            />
                            {errors.email && <p style={{color: 'red', fontSize: '0.9rem', marginTop: '5px'}}>{errors.email}</p>}
                        </div>

                        <div className="form-group">
                            <label htmlFor="age">Age *</label>
                            <input
                                type="number"
                                id="age"
                                name="age"
                                value={formData.age}
                                onChange={handleChange}
                                placeholder="Enter your age"
                                min="1"
                                max="120"
                            />
                            {errors.age && <p style={{color: 'red', fontSize: '0.9rem', marginTop: '5px'}}>{errors.age}</p>}
                        </div>

                        <div className="form-group">
                            <label htmlFor="country">Country *</label>
                            <select
                                id="country"
                                name="country"
                                value={formData.country}
                                onChange={handleChange}
                            >
                                <option value="">Select a country</option>
                                <option value="USA">United States</option>
                                <option value="UK">United Kingdom</option>
                                <option value="Canada">Canada</option>
                                <option value="India">India</option>
                                <option value="Australia">Australia</option>
                                <option value="Other">Other</option>
                            </select>
                            {errors.country && <p style={{color: 'red', fontSize: '0.9rem', marginTop: '5px'}}>{errors.country}</p>}
                        </div>

                        <div className="form-group">
                            <label htmlFor="bio">Bio (Optional)</label>
                            <textarea
                                id="bio"
                                name="bio"
                                value={formData.bio}
                                onChange={handleChange}
                                placeholder="Tell us about yourself..."
                            />
                        </div>

                        <div className="form-group">
                            <label style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                                <input
                                    type="checkbox"
                                    name="subscribe"
                                    checked={formData.subscribe}
                                    onChange={handleChange}
                                    style={{width: 'auto'}}
                                />
                                Subscribe to newsletter
                            </label>
                        </div>

                        <div style={{display: 'flex', gap: '10px'}}>
                            <button type="submit">Submit</button>
                            <button type="button" onClick={handleReset}>Reset</button>
                        </div>
                    </form>

                    {submitted && (
                        <div className="form-output">
                            <h3>✅ Form Submitted Successfully!</h3>
                            <p><strong>Name:</strong> {formData.name}</p>
                            <p><strong>Email:</strong> {formData.email}</p>
                            <p><strong>Age:</strong> {formData.age}</p>
                            <p><strong>Country:</strong> {formData.country}</p>
                            {formData.bio && <p><strong>Bio:</strong> {formData.bio}</p>}
                            <p><strong>Newsletter:</strong> {formData.subscribe ? 'Yes' : 'No'}</p>
                        </div>
                    )}

                    <div className="explanation">
                        <h4>💡 Controlled Components</h4>
                        <p>
                            Each input's value is controlled by React state. When you type, 
                            onChange updates the state, which re-renders the component with the new value. 
                            This gives React full control over the form data.
                        </p>
                    </div>
                </div>
            );
        }

        // 3. COUNTER WITH LIFECYCLE - Demonstrates multiple effects
        function CounterWithLifecycle() {
            const [count, setCount] = useState(0);
            const [multiplier, setMultiplier] = useState(1);
            const [logs, setLogs] = useState([]);

            const addLog = (message) => {
                setLogs(prev => [...prev, `${new Date().toLocaleTimeString()}: ${message}`]);
            };

            // Effect 1: Runs on mount only
            useEffect(() => {
                addLog('🎬 Component mounted (componentDidMount)');
                
                return () => {
                    addLog('👋 Component will unmount (componentWillUnmount)');
                };
            }, []); // Empty array = run once on mount

            // Effect 2: Runs when count changes
            useEffect(() => {
                addLog(`🔢 Count changed to: ${count}`);
                
                // Update document title
                document.title = `Count: ${count}`;
            }, [count]); // Runs when count changes

            // Effect 3: Runs when multiplier changes
            useEffect(() => {
                addLog(`✖️ Multiplier changed to: ${multiplier}`);
            }, [multiplier]);

            // Effect 4: Runs on every render
            useEffect(() => {
                addLog('🔄 Component rendered (componentDidUpdate)');
            }); // No dependency array = runs on every render

            return (
                <div className="card">
                    <h2>🔢 Counter with Lifecycle</h2>
                    
                    <div className="counter-display">
                        {count * multiplier}
                    </div>
                    
                    <p style={{textAlign: 'center', color: '#666', marginBottom: '20px'}}>
                        {count} × {multiplier} = {count * multiplier}
                    </p>

                    <div className="counter-controls">
                        <button onClick={() => setCount(count - 1)}>➖ Decrease</button>
                        <button onClick={() => setCount(0)}>🔄 Reset</button>
                        <button onClick={() => setCount(count + 1)}>➕ Increase</button>
                    </div>

                    <div style={{marginTop: '20px'}}>
                        <label style={{display: 'block', marginBottom: '10px', textAlign: 'center'}}>
                            Multiplier: {multiplier}
                        </label>
                        <input
                            type="range"
                            min="1"
                            max="10"
                            value={multiplier}
                            onChange={(e) => setMultiplier(Number(e.target.value))}
                            style={{width: '100%'}}
                        />
                    </div>

                    <div className="lifecycle-log">
                        <h3>📋 Lifecycle Logs (Last 6)</h3>
                        {logs.slice(-6).map((log, index) => (
                            <div key={index} className="log-entry">{log}</div>
                        ))}
                    </div>

                    <div className="explanation">
                        <h4>💡 Multiple Effects</h4>
                        <p>
                            This component uses 4 different useEffect hooks to demonstrate different 
                            lifecycle behaviors. Notice how effects with different dependencies run 
                            at different times!
                        </p>
                    </div>
                </div>
            );
        }

        // MAIN APP COMPONENT
        function App() {
            const [showClock, setShowClock] = useState(true);

            return (
                <div className="container">
                    <h1>⚛️ React Hooks Tutorial: useState & useEffect</h1>
                    
                    <div className="demo-grid">
                        <div>
                            <div style={{marginBottom: '20px', textAlign: 'center'}}>
                                <button onClick={() => setShowClock(!showClock)}>
                                    {showClock ? '🚫 Unmount Clock' : '✅ Mount Clock'}
                                </button>
                            </div>
                            {showClock && <LiveClock />}
                        </div>
                        
                        <ControlledForm />
                    </div>

                    <div className="demo-grid">
                        <CounterWithLifecycle />
                        
                        <div className="card">
                            <h2>📚 Key Takeaways</h2>
                            
                            <h3 style={{color: '#667eea', marginTop: '20px', marginBottom: '10px'}}>useState</h3>
                            <ul style={{lineHeight: '1.8', color: '#333'}}>
                                <li>Adds state to functional components</li>
                                <li>Returns [value, setter] pair</li>
                                <li>State updates trigger re-renders</li>
                                <li>Can have multiple useState calls</li>
                            </ul>

                            <h3 style={{color: '#667eea', marginTop: '20px', marginBottom: '10px'}}>useEffect</h3>
                            <ul style={{lineHeight: '1.8', color: '#333'}}>
                                <li>Handles side effects (API calls, timers, subscriptions)</li>
                                <li>Dependency array controls when it runs</li>
                                <li>Return cleanup function to prevent memory leaks</li>
                                <li>Replaces componentDidMount, componentDidUpdate, componentWillUnmount</li>
                            </ul>

                            <div className="code-snippet">
{`// useState example
const [count, setCount] = useState(0);

// useEffect examples
useEffect(() => {
  // Runs once on mount
}, []);

useEffect(() => {
  // Runs when count changes
  return () => {
    // Cleanup
  };
}, [count]);`}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
